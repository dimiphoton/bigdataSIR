[project]
name = "epidemic"
version = "0.1.0"
description = "Modélisation SEIR bayésienne du cours PROJ0016 (ULiège)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.20",
    "jax>=0.4",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "numpyro>=0.15",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "streamlit>=1.32",
    "typer>=0.12",
]

[project.scripts]
epidemic = "epidemic.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epidemic"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["epidemic"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas.*", "jax.*", "jax", "numpyro.*", "numpyro", "arviz.*", "arviz", "optax.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
