# Interventions des consignes.
# contact_reduction : part de contacts retirée (0.25 = −25 %).
# Quand on combine, la réduction la plus forte s'applique,
# sauf le masque, dont l'effet se multiplie avec les autres.

compliance: 0.9
combination_rule: strongest
mask_multiplies: true
incompatible_pairs:
  - [case_isolation, household_quarantine]

interventions:
  mask:
    parameter: null
    infection_rate_reduction: 0.20
  case_isolation:
    parameter: duration_days
    contact_reduction:
      home: 0.25
      school: 1.0
      work: 1.0
      community: 0.90
  household_quarantine:
    parameter: duration_days
    contact_reduction:
      home: 0.25
      school: 1.0
      work: 1.0
      community: 0.90
  lockdown:
    parameter: null
    contact_reduction:
      home: 0.0
      school: 1.0
      work: 0.75
      community: 0.75
  social_distancing:
    parameter: age_threshold
    contact_reduction:
      home: 0.0
      school: 0.0
      work: 0.75
      community: 0.75
